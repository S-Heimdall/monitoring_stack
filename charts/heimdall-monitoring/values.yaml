global:
  clusterName: ""
  installToken: ""
  connectionDirection: pull_query
  singleGateway:
    enabled: true
    image: python:3.12-slim
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        service.beta.kubernetes.io/aws-load-balancer-type: nlb

lgtm:
  prometheus:
    enabled: true
  loki:
    enabled: true
  tempo:
    enabled: true
  alloy:
    enabled: true

kps:
  fullnameOverride: heimdall-kps
  grafana:
    enabled: true
  alertmanager:
    enabled: true
  prometheus:
    prometheusSpec:
      retention: 6h
      scrapeInterval: 30s
      evaluationInterval: 30s
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
  defaultRules:
    create: false

loki:
  fullnameOverride: heimdall-loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    useTestSchema: true
    storage:
      type: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: false
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: true
  lokiCanary:
    enabled: false
  test:
    enabled: false

tempo:
  fullnameOverride: heimdall-tempo
  tempo:
    retention: 6h
  persistence:
    enabled: false
  service:
    type: ClusterIP

alloy:
  fullnameOverride: heimdall-alloy
  alloy:
    configMap:
      create: true
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }
    mounts:
      varlog: true
  controller:
    type: daemonset
  service:
    enabled: true

alerting:
  alertmanager:
    webhook:
      enabled: true
      url: ""
      token: ""
  grafana:
    webhook:
      enabled: false
      url: ""
      token: ""

providers:
  prometheus:
    url: http://heimdall-kps-prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090
  loki:
    url: http://heimdall-loki-gateway.{{ .Release.Namespace }}.svc.cluster.local
  tempo:
    url: http://heimdall-tempo.{{ .Release.Namespace }}.svc.cluster.local:3200
  kubernetesEvents:
    enabled: true
