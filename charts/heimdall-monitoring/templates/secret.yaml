# Bearer 토큰 secret. 값은 values 가 비어 있으면 빈 채로 생성되니 설치 시 --set 으로 주입한다.
#   --set gateway.token=$(openssl rand -hex 32)
#   --set global.heimdall.webhookToken=<원격 Heimdall 과 공유하는 값>
# git 에 토큰 값을 커밋하지 말 것.
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: heimdall-read-gateway-token
  labels:
    {{- include "heimdall-monitoring.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.gateway.token | quote }}
{{- end }}
{{- if .Values.global.heimdall.webhookEnabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: heimdall-webhook-token
  labels:
    {{- include "heimdall-monitoring.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.global.heimdall.webhookToken | quote }}
{{- end }}
