{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heimdall-monitoring.name" . }}-gateway
  labels:
    {{- include "heimdall-monitoring.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "heimdall-monitoring.name" . }}-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "heimdall-monitoring.name" . }}-gateway
    spec:
      containers:
        - name: nginx
          image: {{ .Values.gateway.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HEIMDALL_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heimdall-read-gateway-token
                  key: token
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates
              readOnly: true
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-template
          configMap:
            name: {{ include "heimdall-monitoring.name" . }}-gateway
{{- end }}
