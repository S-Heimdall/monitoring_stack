{{- if .Values.lgtm.prometheus.enabled }}
# npo-alerts 13룰. files/npo-alerts.rules.yaml 를 raw(.Files.Get, 템플릿 처리 안 함)로 읽어
# Prometheus annotation 템플릿 표기를 보존하고, namespace 플레이스홀더만 replace 로 치환한다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "heimdall-monitoring.name" . }}-npo-alerts
  labels:
    {{- include "heimdall-monitoring.labels" . | nindent 4 }}
spec:
  groups:
{{ .Files.Get "files/npo-alerts.rules.yaml" | replace "__TARGET_NS__" (join "|" .Values.targetNamespaces) | replace "__RELEASE_NS__" .Release.Namespace | indent 4 }}
{{- end }}
