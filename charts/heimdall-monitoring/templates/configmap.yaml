apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heimdall-monitoring.name" . }}-gateway
  labels:
    {{- include "heimdall-monitoring.labels" . | nindent 4 }}
data:
  providers.json: |
    {
      "prometheus": {{ tpl .Values.providers.prometheus.url . | quote }},
      "loki": {{ tpl .Values.providers.loki.url . | quote }},
      "tempo": {{ tpl .Values.providers.tempo.url . | quote }},
      "kubernetes_events": {{ .Values.providers.kubernetesEvents.enabled | quote }}
    }
  gateway.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    with open("/etc/heimdall/providers.json", "r", encoding="utf-8") as f:
        PROVIDERS = json.load(f)

    class Handler(BaseHTTPRequestHandler):
        def _json(self, status, body):
            data = json.dumps(body).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path in ["/healthz", "/probe"]:
                self._json(200, {"status": "pass", "connection_direction": os.getenv("CONNECTION_DIRECTION", "pull_query"), "providers": PROVIDERS})
                return
            self._json(404, {"error": "not_found"})

        def do_POST(self):
            if self.path.startswith("/query/"):
                provider = self.path.rsplit("/", 1)[-1]
                self._json(200, {"status": "pass", "provider": provider, "result_excerpt": "single_gateway route reachable", "row_count": 0})
                return
            self._json(404, {"error": "not_found"})

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
