# NPO Context Builder 트리거 알람. 원본(raw)으로 보관 — Helm 은 .Files.Get(템플릿 처리 X)으로 읽고
# __TARGET_NS__(관측 대상 ns 정규식) / __RELEASE_NS__(릴리스 ns) 만 replace 로 치환한다.
# 그래서 annotation 의 Prometheus 템플릿 {{ $labels.x }} 가 Helm 과 충돌하지 않는다.
# scope: service|workload|pod|node|cluster — NPO 가 대상 라벨을 일관되게 읽기 위한 표기.
- name: npo.service-red
  interval: 30s
  rules:
  - alert: ServiceHighErrorRate
    expr: |
      sum by (service_name, k8s_namespace_name) (
        rate(traces_span_metrics_calls_total{
          k8s_namespace_name=~"__TARGET_NS__",
          service_name!="flagd",
          span_kind="SPAN_KIND_SERVER",
          status_code="STATUS_CODE_ERROR"
        }[2m])
      )
      /
      sum by (service_name, k8s_namespace_name) (
        rate(traces_span_metrics_calls_total{
          k8s_namespace_name=~"__TARGET_NS__",
          service_name!="flagd",
          span_kind="SPAN_KIND_SERVER"
        }[2m])
      )
      > 0.05
    for: 1m
    labels:
      severity: critical
      npo_category: service-red
      scope: service
    annotations:
      summary: "{{ $labels.service_name }} — 에러율 초과"
      description: "service={{ $labels.service_name }} — SERVER 에러율 > 5%가 1분간 지속. 현재 {{ $value | humanizePercentage }}."
  - alert: ServiceHighLatencyP99
    expr: |
      histogram_quantile(0.99,
        sum by (le, service_name, k8s_namespace_name) (
          rate(traces_span_metrics_duration_milliseconds_bucket{
            k8s_namespace_name=~"__TARGET_NS__",
            service_name!="flagd",
            span_kind="SPAN_KIND_SERVER"
          }[2m])
        )
      ) / 1000 > 2
    for: 2m
    labels:
      severity: warning
      npo_category: service-red
      scope: service
    annotations:
      summary: "{{ $labels.service_name }} — P99 지연 초과"
      description: "service={{ $labels.service_name }} — P99 지연 > 2s가 2분간 지속. 현재 {{ $value | humanizeDuration }}."
- name: npo.container-resource
  interval: 30s
  rules:
  - alert: ContainerMemoryPressure
    expr: |
      label_replace(
        label_replace(
          sum by (namespace, pod, container) (
            container_memory_working_set_bytes{namespace=~"__TARGET_NS__", container!=""}
          )
          /
          sum by (namespace, pod, container) (
            kube_pod_container_resource_limits{namespace=~"__TARGET_NS__", resource="memory"}
          )
          > 0.95,
          "service_name", "$1", "container", "(.+)"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 15m
    labels:
      severity: warning
      npo_category: container-resource
      scope: pod
    annotations:
      summary: "{{ $labels.pod }}/{{ $labels.container }} — 메모리 압박"
      description: "{{ $labels.pod }}/{{ $labels.container }} — 메모리/limit > 95%가 15분간 지속. 현재 {{ $value | humanizePercentage }}."
  - alert: ContainerCPUThrottling
    # HEIM-187: label_replace로 container→service_name, namespace→k8s_namespace_name 부여.
    # 미부여 시 (1) incident-manager가 trigger_service를 못 채워 null → Agent IncidentFinalizedEvent
    # 검증 실패로 DLQ, (2) AM inhibit(equal=[service_name,k8s_namespace_name])가 둘 다 empty라
    # 무관 critical과 equal-매칭돼 광역 억제. (payment throttling → service_name=payment)
    expr: |
      label_replace(
        label_replace(
          sum by (namespace, pod, container) (
            rate(container_cpu_cfs_throttled_periods_total{namespace=~"__TARGET_NS__", container!=""}[2m])
          )
          /
          sum by (namespace, pod, container) (
            rate(container_cpu_cfs_periods_total{namespace=~"__TARGET_NS__", container!=""}[2m])
          )
          > 0.25,
          "service_name", "$1", "container", "(.+)"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 3m
    labels:
      # HEIM-181: critical로 격상. CPU throttling은 resource_patch로 교정하는 핵심 근본원인이고,
      # AM inhibit(equal=[service_name,k8s_namespace_name])가 이 라벨 부재로 무관 critical에 의해
      # 이 warning을 광역 억제 → incident 미생성. critical은 inhibit target(warning)이 아님.
      severity: critical
      npo_category: container-resource
      scope: pod
    annotations:
      summary: "{{ $labels.pod }}/{{ $labels.container }} — CPU throttling"
      description: "{{ $labels.pod }}/{{ $labels.container }} — CPU throttling > 25%가 3분간 지속(CPU limit 미설정이면 발화 불가). 현재 {{ $value | humanizePercentage }}."
- name: npo.kubernetes-state
  interval: 30s
  rules:
  - alert: PodOOMKilled
    expr: |
      label_replace(
        label_replace(
          kube_pod_container_status_terminated_reason{
            namespace=~"__TARGET_NS__",
            reason="OOMKilled"
          } > 0,
          "service_name", "$1", "container", "(.+)"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 0m
    labels:
      severity: critical
      npo_category: kubernetes-state
      scope: pod
    annotations:
      summary: "{{ $labels.pod }}/{{ $labels.container }} — OOMKilled"
      description: "{{ $labels.pod }}/{{ $labels.container }} — OOMKilled 종료 발생. 메모리 limit 초과 또는 노드 압박."
  - alert: PodCrashLooping
    expr: |
      label_replace(
        label_replace(
          increase(kube_pod_container_status_restarts_total{namespace=~"__TARGET_NS__"}[15m]) > 3,
          "service_name", "$1", "container", "(.+)"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 2m
    labels:
      severity: critical
      npo_category: kubernetes-state
      scope: pod
    annotations:
      summary: "{{ $labels.pod }}/{{ $labels.container }} — CrashLooping"
      description: "{{ $labels.pod }}/{{ $labels.container }} — 15분간 재시작 > 3회가 2분간 지속. 현재 {{ $value }}회."
  - alert: DeploymentReplicasUnavailable
    expr: |
      label_replace(
        label_replace(
          kube_deployment_status_replicas_unavailable{namespace=~"__TARGET_NS__"} > 0,
          "service_name", "$1", "deployment", "(.+)"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 2m
    labels:
      severity: warning
      npo_category: kubernetes-state
      scope: workload
    annotations:
      summary: "{{ $labels.deployment }} — 가용 레플리카 부족"
      description: "{{ $labels.deployment }} — unavailable replica > 0이 2분간 지속. desired vs available 불일치."
  - alert: PodNotReady
    expr: |
      label_replace(
        label_replace(
          sum by (namespace, pod) (
            kube_pod_status_ready{namespace=~"__TARGET_NS__", condition="false"}
          ) > 0,
          "service_name", "$1", "pod", "([^-]+).*"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 3m
    labels:
      severity: warning
      npo_category: kubernetes-state
      scope: pod
    annotations:
      summary: "{{ $labels.pod }} — NotReady"
      description: "{{ $labels.pod }} — Ready=false가 3분간 지속."
  - alert: PodPending
    expr: |
      label_replace(
        label_replace(
          kube_pod_status_phase{namespace=~"__TARGET_NS__", phase="Pending"} == 1,
          "service_name", "$1", "pod", "([^-]+).*"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 3m
    labels:
      severity: warning
      npo_category: kubernetes-state
      scope: pod
    annotations:
      summary: "{{ $labels.pod }} — Pending"
      description: "{{ $labels.pod }} — Pending이 3분간 지속. 노드 부족 또는 image pull 실패 가능."
- name: npo.node-infra
  interval: 30s
  rules:
  - alert: NodeMemoryPressure
    expr: |
      1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
    for: 5m
    labels:
      severity: warning
      npo_category: node-infra
      scope: node
    annotations:
      summary: "노드 {{ $labels.instance }} — 메모리 압박"
      description: "노드 {{ $labels.instance }} — 메모리 사용률 > 90%가 5분간 지속. 현재 {{ $value | humanizePercentage }}."
  - alert: NodeDiskPressure
    expr: |
      kube_node_status_condition{condition="DiskPressure", status="true"} == 1
    for: 2m
    labels:
      severity: critical
      npo_category: node-infra
      scope: node
    annotations:
      summary: "노드 {{ $labels.node }} — DiskPressure"
      description: "노드 {{ $labels.node }} — DiskPressure 컨디션 발생. Pod 축출 위험."
- name: npo.monitoring-self
  interval: 60s
  rules:
  - alert: ScrapeTargetDown
    expr: |
      up == 0
    for: 3m
    labels:
      severity: warning
      npo_category: monitoring-self
      scope: cluster
    annotations:
      summary: "{{ $labels.job }}/{{ $labels.instance }} — 스크랩 실패"
      description: "{{ $labels.job }}/{{ $labels.instance }} — 스크랩 실패(up==0)가 3분간 지속."
  - alert: AlertmanagerNotConnected
    expr: |
      prometheus_notifications_alertmanagers_discovered{namespace="__RELEASE_NS__"} < 1
    for: 2m
    labels:
      severity: critical
      npo_category: monitoring-self
      scope: cluster
    annotations:
      summary: "Alertmanager — 연결 끊김"
      description: "Alertmanager — Prometheus가 2분간 발견 못 함. 알람 라우팅 중단."
# ─────────────────────────────────────────────
# 6. SLO 에러버짓 번레이트 (예측형: SLO 깨지기 전 경보)
# 이미 터진 에러율과 달리, 에러버짓 소진 "속도"로 위반 임박을 잡는다. 다중 창(5m·1h) 동시 충족.
# ─────────────────────────────────────────────
- name: npo.slo-burn
  interval: 30s
  rules:
  - alert: CheckoutErrorBudgetBurnFast
    expr: |
      (
        sum(rate(traces_span_metrics_calls_total{k8s_namespace_name=~"__TARGET_NS__", service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
        / sum(rate(traces_span_metrics_calls_total{k8s_namespace_name=~"__TARGET_NS__", service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))
        > 0.144
      )
      and
      (
        sum(rate(traces_span_metrics_calls_total{k8s_namespace_name=~"__TARGET_NS__", service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[1h]))
        / sum(rate(traces_span_metrics_calls_total{k8s_namespace_name=~"__TARGET_NS__", service_name="checkout", span_kind="SPAN_KIND_SERVER"}[1h]))
        > 0.144
      )
    for: 2m
    labels:
      severity: critical
      npo_category: slo-burn
      scope: service
      service_name: checkout
      k8s_namespace_name: __TARGET_NS__
    annotations:
      summary: "checkout — 에러버짓 빠른 소진(SLO 위반 임박)"
      description: "checkout 가용성 SLO(목표 99%)의 에러버짓을 14.4x 속도로 소진 중(5m·1h 에러율 동시 > 14.4%). 이대로면 곧 SLO 위반."
# ─────────────────────────────────────────────
# 7. 포화 선행지표 (예측형: 한계로 수렴 → 곧 고갈/OOM/백로그)
# ─────────────────────────────────────────────
- name: npo.saturation
  interval: 30s
  rules:
  - alert: DBConnectionPoolSaturation
    expr: |
      db_client_connection_count{k8s_namespace_name=~"__TARGET_NS__", db_client_connection_state="used"}
      / on (k8s_pod_name, db_client_connection_pool_name) group_left()
      db_client_connection_max{k8s_namespace_name=~"__TARGET_NS__"}
      > 0.8
    for: 3m
    labels:
      severity: warning
      npo_category: saturation
      scope: service
    annotations:
      summary: "{{ $labels.service_name }} — DB 커넥션 풀 포화"
      description: "{{ $labels.service_name }} — 사용 커넥션/max > 80%가 3분간 지속. 풀 고갈 시 신규 쿼리 대기/실패. 현재 {{ $value | humanizePercentage }}."
  - alert: KafkaConsumerLagGrowing
    expr: |
      kafka_consumer_records_lag_avg{k8s_namespace_name=~"__TARGET_NS__"} > 100
    for: 2m
    labels:
      severity: warning
      npo_category: saturation
      scope: workload
    annotations:
      summary: "{{ $labels.service_name }} — Kafka consumer lag 누적"
      description: "{{ $labels.service_name }} consumer(topic={{ $labels.topic }}) lag > 100 records가 2분간 지속. 컨슈머가 처리 속도를 못 따라가 백로그 누적 중. 현재 {{ $value }}."
  - alert: ContainerMemoryFillingUp
    # 높음(>85%) "그리고" 실제 증가 중(20분간 limit의 3% 이상 상승)일 때만.
    # JVM 등 정상적으로 limit 근처에 상주하는 컨테이너(kafka ~91%)의 상시 오탐 방지.
    expr: |
      label_replace(
        label_replace(
          (
            sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~"__TARGET_NS__", container!=""})
            / sum by (namespace, pod, container) (kube_pod_container_resource_limits{namespace=~"__TARGET_NS__", resource="memory"})
            > 0.85
          )
          and
          (
            sum by (namespace, pod, container) (
              container_memory_working_set_bytes{namespace=~"__TARGET_NS__", container!=""}
              - container_memory_working_set_bytes{namespace=~"__TARGET_NS__", container!=""} offset 20m
            )
            / sum by (namespace, pod, container) (kube_pod_container_resource_limits{namespace=~"__TARGET_NS__", resource="memory"})
            > 0.03
          ),
          "service_name", "$1", "container", "(.+)"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 10m
    labels:
      severity: warning
      npo_category: saturation
      scope: pod
    annotations:
      summary: "{{ $labels.pod }}/{{ $labels.container }} — 메모리 차오름(OOM 선행)"
      description: "{{ $labels.pod }}/{{ $labels.container }} — 메모리/limit > 85%이고 20분간 계속 상승 중. >95%(ContainerMemoryPressure)·OOMKilled 직전 선행 신호. 현재 {{ $value | humanizePercentage }}."
  - alert: NodeDiskWillFillSoon
    expr: |
      (
        predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint="/"}[6h], 24*3600) < 0
      )
      and
      (
        node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint="/"}
        / node_filesystem_size_bytes{fstype!~"tmpfs|overlay", mountpoint="/"}
        < 0.4
      )
    for: 15m
    labels:
      severity: warning
      npo_category: node-infra
      scope: node
    annotations:
      summary: "노드 {{ $labels.instance }} — 디스크 24h 내 소진 예상"
      description: "노드 {{ $labels.instance }} 루트 디스크가 현재 추세로 24시간 내 소진 예상(predict_linear) & 여유 < 40%. 선제 정리/증설 필요."
# ─────────────────────────────────────────────
# 8. 오토스케일링 한계 (예측형: 부하 늘면 늘려서 대응하다 천장에 막힘)
# ─────────────────────────────────────────────
- name: npo.autoscaling
  interval: 30s
  rules:
  - alert: HPAScaleOutBlocked
    expr: |
      label_replace(
        label_replace(
          (
            kube_horizontalpodautoscaler_status_condition{namespace=~"__TARGET_NS__", condition="ScalingLimited", status="true"} == 1
          )
          and on (horizontalpodautoscaler, namespace)
          (
            kube_horizontalpodautoscaler_status_current_replicas{namespace=~"__TARGET_NS__"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace=~"__TARGET_NS__"}
          ),
          "service_name", "$1", "horizontalpodautoscaler", "(.+)"
        ),
        "k8s_namespace_name", "$1", "namespace", "(.+)"
      )
    for: 2m
    labels:
      severity: critical
      npo_category: autoscaling
      scope: workload
    annotations:
      summary: "{{ $labels.horizontalpodautoscaler }} — HPA 스케일아웃 한계(더 못 늘림)"
      description: "HPA {{ $labels.horizontalpodautoscaler }} — max replica 도달 & ScalingLimited가 2분간 지속. 부하를 더 받으면 흡수 불가, 서비스 저하 임박."
